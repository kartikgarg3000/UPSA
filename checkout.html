<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UPSA Test Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg: #050816;
        --card-bg: #0f172a;
        --accent: #22c55e;
        --accent-soft: rgba(34, 197, 94, 0.15);
        --border: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #1f2937, #020617);
        color: var(--text);
      }

      .card {
        background: linear-gradient(145deg, #020617, #020617);
        border-radius: 18px;
        padding: 24px 22px;
        width: 100%;
        max-width: 430px;
        border: 1px solid var(--border);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .badge {
        font-size: 11px;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .title {
        font-size: 18px;
        font-weight: 600;
      }

      .subtitle {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      .amount-box {
        margin-top: 12px;
        margin-bottom: 16px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .amount-label {
        font-size: 12px;
        color: var(--muted);
      }

      .amount-value {
        font-size: 20px;
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 10px;
      }

      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #020617;
        color: var(--text);
        font-size: 13px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4);
      }

      .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .btn {
        flex: 1;
        padding: 10px 14px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #22c55e, #4ade80);
        color: #022c22;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: transform 0.1s ease, box-shadow 0.1s ease,
          filter 0.15s ease;
      }

      .btn.secondary {
        background: #020617;
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
      }

      .btn:hover {
        filter: brightness(1.05);
        box-shadow: 0 12px 30px rgba(34, 197, 94, 0.35);
      }

      .btn.secondary:hover {
        filter: brightness(1.1);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.7);
      }

      .btn:active {
        transform: translateY(1px) scale(0.99);
        box-shadow: none;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: wait;
        box-shadow: none;
        transform: none;
      }

      .btn span.icon {
        font-size: 16px;
      }

      .status {
        margin-top: 12px;
        font-size: 12px;
        min-height: 18px;
      }

      .status.success {
        color: #4ade80;
      }

      .status.error {
        color: var(--danger);
      }

      .status.info {
        color: var(--muted);
      }

      .status pre {
        margin-top: 4px;
        background: #020617;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .footer {
        margin-top: 14px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }

      .footer span {
        color: var(--accent);
        font-weight: 500;
      }

      @media (max-width: 480px) {
        .card {
          margin: 12px;
          padding: 18px 16px;
        }
        .btn-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <div>
          <div class="title">UPSA Test Payment</div>
          <div class="subtitle">Unified Payment Status Aggregator</div>
        </div>
        <div class="badge">Test Mode</div>
      </div>

      <div class="amount-box">
        <div>
          <div class="amount-label">Amount</div>
          <div class="amount-value" id="amountLabel">₹ 0</div>
        </div>
        <div class="hint">Display only · Actual payable from backend order</div>
      </div>

      <div class="form-group">
        <label for="orderId">Razorpay Order ID</label>
        <input
          type="text"
          id="orderId"
          placeholder="e.g. order_RlCwJDqP72FxmR"
        />
        <div class="hint">
          Paste the <b>orderId</b> returned from <code>/api/payments/create</code>.
        </div>
      </div>

      <div class="form-group">
        <label for="amount">Display Amount (₹)</label>
        <input type="number" id="amount" placeholder="e.g. 5500" min="1" />
        <div class="hint">
          For display only. Backend controls the actual order amount.
        </div>
      </div>

      <div class="form-group">
        <label for="name">Customer Name</label>
        <input type="text" id="name" placeholder="Kartik Garg" />
      </div>

      <div class="form-group">
        <label for="email">Customer Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="phone">Customer Phone</label>
        <input type="tel" id="phone" placeholder="9876543210" />
      </div>

      <div class="btn-row">
        <button id="payBtn" class="btn">
          <span class="icon">💳</span>
          <span>Pay with Razorpay</span>
        </button>
        <button id="statusBtn" class="btn secondary">
          <span class="icon">🔍</span>
          <span>Check Status</span>
        </button>
      </div>

      <div id="status" class="status info"></div>

      <div class="footer">
        Uses <span>Razorpay Test Mode</span>. No real money is involved.
      </div>
    </div>

    <!-- Razorpay checkout script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      // 🔧 CONFIG – CHANGE THIS
     const RAZORPAY_KEY_ID = "rzp_test_xxxxxxxxx"; // put real key 
     const BACKEND_BASE_URL = "http://localhost:5000"; // your backend URL

      // 🧠 Utility: read ?order_id=...&amount=...
      const urlParams = new URLSearchParams(window.location.search);
      const orderFromQuery = urlParams.get("order_id"); 
      const amountFromQuery = urlParams.get("amount");

      const orderInput = document.getElementById("orderId");
      const amountInput = document.getElementById("amount");
      const amountLabel = document.getElementById("amountLabel");
      const statusEl = document.getElementById("status");
      const payBtn = document.getElementById("payBtn");
      const statusBtn = document.getElementById("statusBtn");

      // Prefill from query params if present
      if (orderFromQuery) {
        orderInput.value = orderFromQuery;
      }
      if (amountFromQuery) {
        amountInput.value = amountFromQuery;
        amountLabel.textContent = "₹ " + amountFromQuery;
      }

      amountInput.addEventListener("input", () => {
        const val = amountInput.value || 0;
        amountLabel.textContent = "₹ " + val;
      });

      function setStatus(message, type = "info", extraJson) {
        statusEl.textContent = message;
        statusEl.className = "status " + type;
        if (extraJson) {
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(extraJson, null, 2);
          statusEl.appendChild(pre);
        }
      }

      payBtn.addEventListener("click", function (e) {
        e.preventDefault();
        setStatus("");

        const orderId = orderInput.value.trim();
        const displayAmount = amountInput.value.trim();
        const name = document.getElementById("name").value.trim() || "Test User";
        const email =
          document.getElementById("email").value.trim() || "test@example.com";
        const phone =
          document.getElementById("phone").value.trim() || "9999999999";

        if (!orderId) {
          setStatus("Please enter a valid Razorpay orderId.", "error");
          return;
        }

        if (!RAZORPAY_KEY_ID || RAZORPAY_KEY_ID.startsWith("rzp_test_xxxx")) {
          setStatus(
            "Please configure your RAZORPAY_KEY_ID in the script.",
            "error"
          );
          return;
        }

        payBtn.disabled = true;
        setStatus("Opening Razorpay checkout...", "info");

        const options = {
          key: RAZORPAY_KEY_ID,
          order_id: orderId, // backend-created order
          name: "UPSA Demo",
          description: "Unified Payment Status Aggregator",
          prefill: {
            name,
            email,
            contact: phone,
          },
          notes: {
            project: "UPSA Demo",
            displayAmount: displayAmount || "not-set",
          },
          theme: {
            color: "#22c55e",
          },
          handler: function (response) {
            console.log("Payment success:", response);
            setStatus(
              "Payment Success! Payment ID: " + response.razorpay_payment_id,
              "success"
            );
            payBtn.disabled = false;
          },
          modal: {
            ondismiss: function () {
              setStatus("Payment popup closed.", "error");
              payBtn.disabled = false;
            },
          },
        };

        const rzp = new Razorpay(options);
        rzp.open();
      });

      statusBtn.addEventListener("click", async function (e) {
        e.preventDefault();
        const orderId = orderInput.value.trim();
        if (!orderId) {
          setStatus("Please enter an orderId to check status.", "error");
          return;
        }

        try {
          statusBtn.disabled = true;
          setStatus("Checking status from backend...", "info");
          const res = await fetch(
            `${BACKEND_BASE_URL}/api/payments/${orderId}`
          );

          if (!res.ok) {
            const data = await res.json().catch(() => null);
            setStatus(
              data?.message || "Failed to fetch status from backend.",
              "error"
            );
            statusBtn.disabled = false;
            return;
          }

          const data = await res.json();
          const msg = `Status: ${data.status.toUpperCase()} · Provider: ${
            data.provider
          } · Amount: ₹${data.amount}`;
          setStatus(msg, data.status === "paid" ? "success" : "info", data);
        } catch (err) {
          console.error(err);
          setStatus("Error calling backend status API.", "error");
        } finally {
          statusBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
